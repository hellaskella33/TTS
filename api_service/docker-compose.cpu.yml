version: '3.8'

# CPU-only version for macOS or systems without NVIDIA GPU
services:
  tts-api:
    build:
      context: ..
      dockerfile: api_service/Dockerfile
    container_name: tts-api-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - COQUI_TOS_AGREED=1
    volumes:
      # Optional: Mount voices directory for custom reference audio
      - ./voices:/app/api_service/voices
      # Optional: Mount for model caching (to avoid re-downloading)
      - tts-models-cache:/root/.local/share/tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tts-models-cache:
    driver: local
