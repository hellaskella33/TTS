# CPU-only version for macOS or systems without NVIDIA GPU
# Following Docker Compose best practices 2026

services:
  tts-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-api-service
    ports:
      - "${TTS_API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Mount voices directory for custom reference audio
      - ./voices:/app/api_service/voices
      # Model cache to avoid re-downloading
      - tts-models-cache:/root/.local/share/tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  tts-models-cache:
    driver: local
